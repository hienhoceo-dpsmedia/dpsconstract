services:
  postgres-test:
    image: postgres:16-alpine
    container_name: dps-contract-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: dps_contract_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dps_contract_test"]
      interval: 3s
      timeout: 3s
      retries: 5

